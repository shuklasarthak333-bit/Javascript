<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>SARTHAK</h1>
    <button id = "time"> STOP The TimeOut!</button>
    <script>
        const change = document.querySelector("h1");
        const changed = setTimeout(() => {
            change.innerHTML = "SHUKLA";
            console.log("changed");
        }, 3000);
        const butt = document.getElementById("time");
        butt.addEventListener('click',()=>{
            clearTimeout(changed);
            console.log("cleared");    
        })
    </script>
</body>
</html>
